name: Édition automatique

# Toutes les 10 minutes : on récupère les journaux, on classe par importance,
# la rédaction (Claude) écrit les articles, on traduit et on publie sur GitHub Pages.
# GitHub peut décaler un passage planifié de quelques minutes quand ses serveurs sont chargés.
on:
  push:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cache (traductions et articles déjà rédigés)
        uses: actions/cache@v4
        with:
          path: .cache
          key: journal-${{ github.run_id }}
          restore-keys: |
            journal-
            translations-

      - name: Générer l'édition
        # si les sources sont injoignables, l'édition déjà présente est conservée
        continue-on-error: true
        env:
          # Settings → Secrets and variables → Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JOURNAL_MODEL: ${{ vars.JOURNAL_MODEL }}
          JOURNAL_EFFORT: ${{ vars.JOURNAL_EFFORT }}
          JOURNAL_WRITE_LIMIT: ${{ vars.JOURNAL_WRITE_LIMIT }}
        run: node scripts/build-news.mjs

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js assets data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
